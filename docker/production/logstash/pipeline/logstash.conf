input {
    gelf {
        port => 12201
    }
}

filter {
    json {
        source => "message"
        tag_on_failure => ["json_parse_failed"]
    }

    date {
        match => ["@timestamp", "ISO8601"]
        target => "@timestamp"
    }

    grok {
        match => {
            "caller" => "%{DATA:log_file}:%{INT:log_line}"
        }
        tag_on_failure => ["caller_parse_failed"]
    }

    mutate {
        rename => {
            "host" => "host_name"
        }
    }

    mutate {
        convert => {
            "latency" => "float"
            "log_line" => "integer"
        }
    }
}

output {
	elasticsearch {
        hosts => "elasticsearch:9200"
        user => "logstash_internal"
        password => "${LOGSTASH_INTERNAL_PASSWORD}"
        retry_on_conflict => 3
        ilm_enabled => true
        ilm_policy => "app-logs-policy"
        ilm_rollover_alias => "app-logs"
        ssl_enabled => false
	}
}